# The hand-published b2b/ channel (see README) has no build workflow, so this
# is where its descriptors are checked before they can reach Pages: every
# b2b/<dir>/ with a descriptor passes scripts/verify-wgt.sh, <ver> matches the
# package version, every version carries the author key latest/ serves, and
# b2b/latest/ is one of the version directories (behind the highest is
# reported, not failed - that is README step 1).
name: Verify b2b
on:
  # Every pull request, unfiltered, so that a required status check named
  # "Verify b2b / verify" always has a run to report - a path filter would
  # leave PRs that do not touch b2b/ with no run at all, and a required check
  # with no run blocks the merge.
  pull_request:
  # On main the paths matter: a push that cannot change the verdict needs no
  # run beside the Deploy site run that published it.
  push:
    branches: [main]
    paths:
      - 'b2b/**'
      - 'scripts/check-b2b.sh'
      - 'scripts/guard-b2b-site.sh'
      - 'scripts/verify-wgt.sh'
      - 'scripts/author-identity-gate.sh'
      - 'scripts/author-identity.sh'
      - '.github/workflows/verify-b2b.yml'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The job only reads the tree; no git operation needs the token.
          persist-credentials: false
      # The <ver> latest/ served before this change, so the gate can refuse a
      # latest/ that goes backwards. On a pull request that is the base
      # branch; on a push to main it is the parent of the push.
      - name: Fetch the base to compare latest/'s <ver> against
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            echo "ref=FETCH_HEAD" >> "$GITHUB_OUTPUT"
          else
            # The state of main before this push - not HEAD~1, which is only
            # that for a single-commit push. A new branch has no before.
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "no before-sha (new branch) - skipping the backwards check"
              echo "ref=" >> "$GITHUB_OUTPUT"
            elif git fetch --no-tags --depth=1 origin "$before"; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::before-sha $before is gone (force-push?) - skipping the backwards check"
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: scripts/check-b2b.sh b2b
        env:
          CHECK_B2B_BASE: ${{ steps.base.outputs.ref }}
      # The guard the publish workflows run, both of its paths: on a good
      # b2b/ it must leave the assembled site's b2b/ in place; on a b2b/ whose
      # latest/ is broken it must drop latest/ and keep the version
      # directory - that drop path is what protects production/'s rollback,
      # so it is asserted here rather than first exercised by a real deploy.
      - name: The publish guard keeps a good b2b/ and drops only a broken one
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          git archive HEAD | tar -x -C _site
          scripts/guard-b2b-site.sh _site
          test -f _site/b2b/latest/sssp_config.xml
          # The version directory latest/ mirrors today, whichever that is.
          kept="$(for d in _site/b2b/*/; do d="${d%/}"; [ "$(basename "$d")" = latest ] && continue; diff -rq _site/b2b/latest "$d" >/dev/null && echo "$d" && break; done)"
          test -n "$kept"
          sed -i 's|<size>[0-9]*</size>|<size>1</size>|' _site/b2b/latest/sssp_config.xml
          scripts/guard-b2b-site.sh _site
          test ! -e _site/b2b/latest
          test -f "$kept/sssp_config.xml"
          rm -rf _site
