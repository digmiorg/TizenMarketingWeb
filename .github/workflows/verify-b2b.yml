# The hand-published b2b/ channel (see README) has no build workflow, so this
# is where its descriptors are checked before they can reach Pages: every
# b2b/<dir>/ with a descriptor passes scripts/verify-wgt.sh, <ver> matches the
# package version, every version carries the author key latest/ serves, and
# b2b/latest/ is one of the version directories (behind the highest is
# reported, not failed - that is README step 1).
name: Verify b2b
on:
  pull_request:
    paths: &paths
      - 'b2b/**'
      - 'scripts/check-b2b.sh'
      - 'scripts/verify-wgt.sh'
      - 'scripts/author-identity-gate.sh'
      - 'scripts/author-identity.sh'
      - '.github/workflows/verify-b2b.yml'
  # Also on main, so a merge made while the check was red (or a direct push)
  # is at least visible beside the Deploy site run that published it.
  push:
    branches: [main]
    paths: *paths
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The job only reads the tree; no git operation needs the token.
          persist-credentials: false
      - run: scripts/check-b2b.sh b2b
