name: Release widget

# Manual only, and publishing to `latest/` is a separate opt-in.
#
# The fleet follows `production/latest/`, so a workflow that wrote there on
# every push would hand every screen an untested build. A Samsung display also
# refuses an update signed by a different author certificate than the one it
# already has, which means the first release after a certificate change has to
# be proven on one panel before the rest of the estate is pointed at it.
#
# So: build and verify freely, publish deliberately.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit the package to production/<version>/'
        type: boolean
        default: false
      publish_latest:
        description: 'Also update production/latest/ — this rolls out THIS build to the fleet, untested'
        type: boolean
        default: false
      force:
        description: 'Overwrite an already-published production/<version>/'
        type: boolean
        default: false
      accept_new_author_certificate:
        description: 'Allow a different signing KEY — the installed estate will stop updating'
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time. Two runs publishing at once would each clear the
# backwards gate against the same baseline, and whichever committed last would
# leave latest/ advertising the lower <ver> — a fleet frozen on an older build
# with both jobs green.
concurrency:
  group: release-widget
  cancel-in-progress: false
  # `queue: max`, not the default `single`: GitHub cancels and replaces any
  # pending run in a group when a new one is queued, and this group now holds
  # two workflows. A Release widget dispatch would silently evict a Promote
  # release that was waiting behind it — losing a rollout of an already-proven
  # package, with a grey run as the only trace.
  queue: max

env:
  # Pinned deliberately: Samsung re-spins installers under the same URL, so the
  # checksum is the only thing that says we got what we tested against. Both
  # live as repository variables; see BUILD.md for how to refresh them.
  TIZEN_INSTALLER_URL: ${{ vars.TIZEN_INSTALLER_URL }}
  TIZEN_INSTALLER_SHA256: ${{ vars.TIZEN_INSTALLER_SHA256 }}
  TIZEN_HOME: ${{ github.workspace }}/.tizen-studio
  CERT_PROFILE: digmi-ci

jobs:
  build:
    runs-on: ubuntu-24.04
    # A blocked password prompt inside the Tizen CLI waits forever; without a
    # ceiling it would hold a runner for the default six hours.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
      src_tree: ${{ steps.trees.outputs.src_tree }}
      scripts_tree: ${{ steps.trees.outputs.scripts_tree }}
      sssp_ver: ${{ steps.build.outputs.sssp_ver }}
      size: ${{ steps.build.outputs.size }}
      widget_name: ${{ steps.build.outputs.widget_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Refuse a rollout that publishes nothing
        if: ${{ inputs.publish_latest && !inputs.publish }}
        run: |
          echo "::error::publish_latest is set and publish is not. The publish job"
          echo "::error::only runs when publish is set, so this run would finish green"
          echo "::error::having changed nothing at all — the one outcome a rollout must"
          echo "::error::never have. Either set publish as well, to build this version"
          echo "::error::and roll it out in one go, or use the Promote release workflow"
          echo "::error::to roll out a version that is already published and proven."
          exit 1

      - name: Refuse to publish from anywhere but main
        if: ${{ inputs.publish || inputs.publish_latest }}
        run: |
          # Both publish gates measure this build against production/latest/ as
          # it exists in the CHECKED-OUT tree, and workflow_dispatch accepts any
          # ref. Dispatched from an older branch the baseline is whatever that
          # branch happens to carry, so a build can clear "refuse to go
          # backwards" and still strand the fleet on the version it has.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatched from '$GITHUB_REF', not refs/heads/main."
            echo "::error::Build-only runs are fine from any ref; publishing is not."
            exit 1
          fi

      # Git tree object ids, not the commit: they can be compared from a
      # shallow clone with no history in common, which is what the publish job
      # has. See the step that reads them there.
      - name: Record the source tree this build comes from
        id: trees
        run: |
          set -euo pipefail
          {
            echo "src_tree=$(git rev-parse HEAD:src)"
            echo "scripts_tree=$(git rev-parse HEAD:scripts)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the signing inputs are present
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          missing=0
          for v in TIZEN_INSTALLER_URL TIZEN_INSTALLER_SHA256; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; missing=1; }
          done
          [ -n "$AUTHOR_P12" ] || { echo "::error::secret TIZEN_AUTHOR_P12_BASE64 is not set"; missing=1; }
          [ -n "$DISTRIBUTOR_P12" ] || { echo "::error::secret TIZEN_DISTRIBUTOR_P12_BASE64 is not set"; missing=1; }
          # Without these the CLI signs with an empty password and fails deep
          # inside the packager rather than in the step that exists to say
          # "not configured".
          [ -n "$AUTHOR_PASSWORD" ] || { echo "::error::secret TIZEN_AUTHOR_PASSWORD is not set"; missing=1; }
          [ -n "$DISTRIBUTOR_PASSWORD" ] || { echo "::error::secret TIZEN_DISTRIBUTOR_PASSWORD is not set"; missing=1; }
          exit $missing

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Tizen Studio CLI
        run: |
          set -euo pipefail
          curl -fsSL -o installer.bin "$TIZEN_INSTALLER_URL"
          echo "$TIZEN_INSTALLER_SHA256  installer.bin" | sha256sum -c -
          chmod +x installer.bin
          ./installer.bin --accept-license "$TIZEN_HOME"
          echo "$TIZEN_HOME/tools/ide/bin" >> "$GITHUB_PATH"

          # A broken install, or a JDK the toolchain will not talk to, otherwise
          # surfaces deep inside the dbus-run-session block where the error is
          # unreadable. The JDK pinned above is NOT verified against Tizen
          # Studio 6.1; if this line is what fails, that is the first thing to
          # change. See BUILD.md.
          "$TIZEN_HOME/tools/ide/bin/tizen" version

          # The signing step passes -f and -A to `security-profiles add`, and
          # they carry weight: -f is what creates profiles.xml at the path the
          # CLI resolves, which is the whole escape from the failure of run
          # 41796421422. Run 41846786550 printed this --help and both are
          # on the binary, so they are measured rather than taken from a
          # transcript. Still printed, because the installer is pinned by
          # checksum and not by version: if a future CLI drops either flag,
          # the usage error further down has its explanation in the same log.
          "$TIZEN_HOME/tools/ide/bin/tizen" security-profiles add --help || true

      - name: Install the keyring the signing engine expects
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus-x11

      - name: Install the Samsung Certificate Extension
        run: |
          set -euo pipefail
          # Samsung certificates do not exist as a profile type without this.
          "$TIZEN_HOME/package-manager/package-manager-cli.bin" \
            install --no-java-check --accept-license "Samsung Certificate Extension"

      - name: Sign and build
        id: build
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          set -euo pipefail
          # Before the files exist, not after: a chmod afterwards leaves them
          # readable for the moment in between.
          umask 077
          CERTS="$RUNNER_TEMP/certs"
          mkdir -p "$CERTS"
          printf '%s' "$AUTHOR_P12" | base64 -d > "$CERTS/author.p12"
          printf '%s' "$DISTRIBUTOR_P12" | base64 -d > "$CERTS/distributor.p12"
          export CERTS

          # One session for both commands. The signing engine keeps certificate
          # passwords in a Freedesktop keyring, and `security-profiles add` and
          # `tizen package` only round-trip them within a single session bus.
          # Split across two steps, the second finds no password and blocks on
          # an interactive prompt until the job times out.
          dbus-run-session -- bash -euo pipefail -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null

            # Security profiles live in the DATA directory: a sibling of the
            # SDK, named after it. Run 41796421422 set this to
            # $TIZEN_HOME/tools/certificate-generator/profiles.xml and got
            # "Not found a file of security profiles" out of
            # `security-profiles add` — that path holds the certificate
            # generator, never the profiles. That run also printed where the
            # directory actually is, which beats any documentation for this
            # layout:
            #
            #   * Data directory : .../TizenMarketingWeb/.tizen-studio-data
            #
            # for TIZEN_HOME=.../TizenMarketingWeb/.tizen-studio. So it is not
            # under $HOME either, unless the SDK is — the cleanup step below
            # was deleting $HOME/tizen-studio-data/profile, which is the right
            # directory for a DEFAULT install and never existed on this one.
            #
            # Asked rather than assumed, with that measured path as the
            # fallback.
            #
            cli_config="$(tizen cli-config -l 2>&1 || true)"
            printf "%s\n" "$cli_config"

            # `default.profiles.path` is the whole NAME of the key, not a
            # default that some bare `profiles.path` overrides. Samsung
            # documents it for this very product — "Default certificate
            # profile path" — directly beside
            # `default.sdb.timeout=<timeout value>`, and that one is a
            # timeout, not a precedence marker:
            # https://developer.samsung.com/smarttv/develop/getting-started/using-sdk/command-line-interface.html
            #
            # The bare spelling is read too, second, and NOT because it is
            # merely undocumented folklore: `security-profiles add` ends by
            # printing advice to set that exact spelling in order to sign
            # with the profile it just made. The reference docs name one, the
            # CLI itself names the other. It is second because the
            # reference docs beat a CLI message when the two disagree, not
            # because the order is unimportant: if a listing ever held both
            # keys, which path the CLI itself uses would be unknown, and
            # this order would be a guess. The fallback below says nothing
            # about that — it only runs when NEITHER spelling matched.
            # BUILD.md quotes both.
            #
            # What a real listing holds was settled by run 41846786550:
            # eight keys, every one of them `default.`-prefixed, no bare
            # `profiles.path`, and `default.profiles.path` already pointing
            # at the data directory. So the documented spelling is the one
            # that answers in practice and the bare read is dead weight that
            # costs nothing.
            #
            # Whether a bare key would OVERRIDE the prefixed one is still
            # unknown, and NOT made harmless by the fallback below: that
            # fallback only runs when the prefixed value is empty, so a
            # listing holding both keys takes the prefixed one here while
            # the CLI might use the other, leaving the mkdir and the
            # PROFILES_FILE export aiming at a file the CLI does not write.
            #
            # What that costs is probably NOTHING visible: -f makes the file
            # at whatever path the CLI resolved, `list -n` then finds the
            # profile, and `package -s` signs. 41796421422 is not the
            # precedent — it died because the path was wrong AND -f was
            # absent. What is left is a profiles.xml stranded outside what
            # cleanup reaches, or an `add` that fails on a resolved path
            # whose parent does not exist, if it turns out not to create
            # intermediate directories. Not a leaked password either way:
            # that is in the keyring, which cleanup removes unconditionally,
            # as it does ${TIZEN_HOME}-data/profile, where the measured value
            # points — and a hosted runner is destroyed with the job
            # regardless. The precondition has never been observed: no
            # listing here has held a bare key. Written down rather than
            # coded around, for that reason. The listing is still printed,
            # because a changed installer could change it.
            #
            # `|| true` on the pipeline: head closes the pipe, and pipefail
            # would turn that SIGPIPE into a failed step. The trim is not
            # theoretical — a path with a stray space is created happily here
            # and then not found by a CLI that trimmed it.
            # $1 is spliced into a sed BRE, so it must arrive escaped and
            # sed-safe: a bare dot matches any character, and a slash ends the
            # substitution. A key that breaks either way comes back empty with
            # status 0, because of the `|| true` below — a silent fall-through
            # to the next spelling, visible only as a sed complaint on stderr.
            cli_config_value() {
              printf "%s\n" "$cli_config" \
                | sed -n "s/^[[:space:]]*$1=//p" \
                | head -1 \
                | tr -d "\r" \
                | sed -e "s/^[[:space:]]*//" -e "s/[[:space:]]*$//" || true
            }
            profiles="$(cli_config_value "default\.profiles\.path")"
            if [ -z "$profiles" ]; then
              profiles="$(cli_config_value "profiles\.path")"
            fi
            : "${profiles:=${TIZEN_HOME}-data/profile/profiles.xml}"
            printf "profiles file: %s\n" "$profiles"
            mkdir -p "$(dirname "$profiles")"

            # So the cleanup step can delete the file we actually used. Not
            # because it holds the passwords — it does not, see that step —
            # but because it is the one artefact of this job that names them.
            printf "PROFILES_FILE=%s\n" "$profiles" >> "$GITHUB_ENV"

            # The documented key, per the page cited above. The bare
            # spelling this line used until now was accepted by the CLI
            # ("Setting configuration is succeeded...." in 41796421422), but
            # acceptance of a key is not proof that anything reads it back.
            #
            # The EFFECT of the write is optional: `add -f` creates the file
            # at whatever path the CLI resolves, and the cleanup step removes
            # ${TIZEN_HOME}-data/profile unconditionally — where the measured
            # value of this key already points — so a write that does not
            # take strands nothing. The fallback above is NOT part of that
            # argument, though the two paths coincide: when the write does
            # not take, the CLI uses its own configured value, and the
            # fallback only decides what $profiles, the mkdir and
            # PROFILES_FILE point at, and only when the listing was silent. Its EXIT STATUS was not optional until
            # this line was guarded — bare under errexit, it would kill the
            # step.
            #
            # CLI 2.5.25 accepts the key: run 41846786550 emitted no
            # warning here and went on to sign. The guard stays anyway,
            # because the only thing it can cost is a log line, and what it
            # buys is that a CLI which stops accepting the key cannot take
            # the whole release down for a write whose effect is optional.
            # A warning rather than `|| true`, so the surprise is visible.
            tizen cli-config "default.profiles.path=$profiles" \
              || echo "::warning::could not set default.profiles.path — continuing, because add -f resolves the path itself"

            # -f creates profiles.xml when it is absent, at the path the CLI
            # itself resolves, which is what the run above died for the want
            # of. -A makes the profile active, so nothing downstream depends
            # on which profile a bare command would pick. Both were printed
            # by the binary itself in run 41846786550, by the --help the
            # CLI install step runs earlier in this job.
            tizen security-profiles add -f -A \
              -n "$CERT_PROFILE" \
              -a "$CERTS/author.p12" -p "$AUTHOR_PASSWORD" \
              -d "$CERTS/distributor.p12" -dp "$DISTRIBUTOR_PASSWORD"

            # Ask about THIS profile rather than matching its name against the
            # whole listing, whose format is no better established than the
            # behaviour being guarded against — a CLI message that merely
            # mentioned the name would have passed.
            #
            # A warning, NOT a gate. `list -n` exits 0 for a profile that is
            # there — run 41846786550 measured it, so the original reason
            # for not gating is gone. It stays a warning because the thing
            # worth failing a release over is an unsigned package, not an
            # unparsed profile listing, and because a CLI version that
            # answered non-zero anyway would otherwise fail a build that
            # signs perfectly, for no new coverage: the real net is
            # verify-wgt.sh, which
            # refuses a package with no author-signature.xml — the documented
            # way `tizen package` exits 0 having signed nothing. What this is
            # worth is a readable line here instead of a confusing one inside
            # the packager.
            if listed="$(tizen security-profiles list -n "$CERT_PROFILE" 2>&1)"; then
              printf "%s\n" "$listed"
            else
              printf "%s\n" "$listed"
              echo "::warning::could not confirm $CERT_PROFILE in $profiles."
              echo "::warning::Continuing: the package is signed with -s and verified"
              echo "::warning::afterwards, so an unsigned one still cannot get out."
              ls -la "$(dirname "$profiles")" || true
            fi

            scripts/build-wgt.sh "$CERT_PROFILE"
          '

      - name: Verify the package
        run: scripts/verify-wgt.sh .build/out

      # The guard that stands in front of `rm -rf` in both build scripts. It
      # shipped once with a hole that deleted a sibling repository's .git with
      # exit 0, and the reason it shipped is that nothing ran it. Running it
      # here is what makes that not merely a promise.
      - name: Exercise the build scripts' path guard
        run: scripts/test-path-guard.sh

      - name: Remove the certificates from the runner
        if: always()
        run: |
          set -euo pipefail
          # What actually holds the secret, in order:
          #
          #   * the .p12 files, written from the secrets — $RUNNER_TEMP/certs;
          #   * the GNOME keyring, where `security-profiles add` puts the
          #     passwords. --unlock with an empty password persists it under
          #     $HOME/.local/share/keyrings, which outlives dbus-run-session;
          #   * profiles.xml, whose password= attribute is NOT the password
          #     but a path to a .pwd entry in that keyring. It names the
          #     secret rather than holding it, which is a reason to delete it
          #     and not a reason to relax about the two above.
          #
          # PROFILES_FILE is whatever the signing step resolved; the fixed
          # paths stay because the step may have failed before it got there.
          rm -rf "$RUNNER_TEMP/certs" \
                 "$HOME/.local/share/keyrings" \
                 "$TIZEN_HOME/tools/certificate-generator" \
                 "${TIZEN_HOME}-data/profile" \
                 "$HOME/tizen-studio-data/profile" \
                 ${PROFILES_FILE:+"$PROFILES_FILE"} || true

      - name: Compare the signing identity against what is served
        env:
          WIDGET: ${{ steps.build.outputs.widget_name }}
        run: |
          set -euo pipefail
          # An empty WIDGET is a bug in the build, and this is one of the places
          # it would otherwise pass unnoticed.
          [ -n "$WIDGET" ] || { echo "::error::no widget name from the build"; exit 1; }

          # Counted rather than `head -1`: two .wgt files in the output
          # directory means the one published and the one compared here may be
          # different files, and picking the first silently is how that becomes
          # invisible.
          count="$(find .build/out -maxdepth 1 -name '*.wgt' | wc -l | tr -d ' ')"
          if [ "$count" != 1 ]; then
            echo "::error::expected exactly one .wgt from the build, found $count"
            exit 1
          fi
          echo "CANDIDATE=$(find .build/out -maxdepth 1 -name '*.wgt')" >> "$GITHUB_ENV"

      # $CANDIDATE comes from the step above, through GITHUB_ENV.
      - name: Refuse a signing identity the estate will not accept
        run: |
          # The mechanism lives in scripts/author-identity-gate.sh, shared with
          # the other publishing workflow and tested on its own. What stays
          # here is the policy: who may overrule it, and when.
          #   0 = same author, 2 = different signing key, 1 = broken state
          # No `set -e`: a non-zero exit is the answer, not a crash.
          set -uo pipefail
          rc=0
          scripts/author-identity-gate.sh "$CANDIDATE" || rc=$?
          [ "$rc" = 2 ] || exit "$rc"

          # A build-only run has no publication to protect, and today it cannot
          # match even in principle: the live package is signed by a key nobody
          # here holds. Failing the run would make the documented first step —
          # both inputs off, read the output — impossible to perform, and the
          # flag that silences it is one nobody should tick for a smoke test.
          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "::notice::Different signing key than what is served. Expected until"
            echo "::notice::the installed estate is reinstalled, and harmless in a run"
            echo "::notice::that publishes nothing — accept_new_author_certificate is"
            echo "::notice::not needed here."
            exit 0
          fi

          # The flag is checked BEFORE the explanation is printed. A run that
          # ends green after printing six ::error:: lines is how people learn to
          # ignore annotations.
          if [ "${{ inputs.accept_new_author_certificate }}" != "true" ]; then
            echo "::error::This build is signed by a different KEY than the one the"
            echo "::error::installed estate carries — not a renewed certificate over the"
            echo "::error::same key, which this gate treats as the same author, but a"
            echo "::error::different one. A display refuses that update, so publishing it"
            echo "::error::means every screen already in the field needs the app"
            echo "::error::uninstalled and reinstalled by hand. If that migration is the"
            echo "::error::intent, re-run with accept_new_author_certificate."
            exit 1
          fi
          echo "::warning::new signing key accepted — the installed estate will not update"

      # Keep the package even when a later gate rejects it. The identity
      # comparison above is precisely the failure where someone has to look
      # inside the .wgt before deciding what to do.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: widget-${{ steps.build.outputs.version }}
          path: .build/out/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    # The live check below waits on a CDN; without a ceiling a stuck fetch holds
    # a runner for the default six hours.
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    # Shared with the Deploy site workflow. Without it the two can deploy over
    # each other: a person pushes to main during a release, their run deploys
    # the tree from before this release, and the live check only catches it
    # while it is still polling. `cancel-in-progress: false` in both places —
    # with `true` a push would cancel this job after it had already committed
    # and pushed, which is worse than the race.
    concurrency:
      group: pages-deploy
      # Without this the group holds one pending entry, and an unrelated push
      # would evict this job from the queue after the build had already signed
      # a package.
      queue: max
      cancel-in-progress: false
    # Required by actions/deploy-pages, and it puts the release in the
    # repository's deployment history where it can be seen and rolled back.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # `ref: main`, not the dispatched commit: this job may have waited in the
      # pages-deploy queue, and it both pushes a commit and deploys the whole
      # tree. From the dispatch-time commit the push is a non-fast-forward, and
      # on the branch where nothing changed there is no push to fail — it would
      # just deploy an older tree and quietly undo whatever landed meanwhile.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Check Pages is built by this workflow, not from the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [ "$mode" != "workflow" ]; then
            echo "::error::Pages build_type is '$mode'. While the site is built from the"
            echo "::error::branch, this commit goes live on GitHub's schedule rather than"
            echo "::error::ours: a run that fails its live check still leaves latest/ on"
            echo "::error::main, and the next unrelated push rolls it out to every screen"
            echo "::error::with nobody watching. Set Settings > Pages > Source to"
            echo "::error::'GitHub Actions' and re-run."
            exit 1
          fi

      - name: Refuse to publish a build of a different source tree
        env:
          SRC_TREE: ${{ needs.build.outputs.src_tree }}
          SCRIPTS_TREE: ${{ needs.build.outputs.scripts_tree }}
        run: |
          set -euo pipefail
          # This job checks out the tip of main so that its commit is a
          # fast-forward (see the checkout above), while the artifact was built
          # from main as it stood at dispatch. If someone pushed to src/ or
          # scripts/ in between, the package about to be committed is not a
          # build of the commit that publishes it — and if the version string
          # did not change, nothing else would ever notice.
          #
          # Tree object ids rather than commits: `git diff` between two commits
          # needs both in the clone, and this one is shallow.
          for pair in "src:$SRC_TREE" "scripts:$SCRIPTS_TREE"; do
            path="${pair%%:*}"
            was="${pair#*:}"
            [ -n "$was" ] || { echo "::error::the build job recorded no tree for $path"; exit 1; }
            now="$(git rev-parse "HEAD:$path")"
            if [ "$was" != "$now" ]; then
              echo "::error::$path/ has changed on main since this build started."
              echo "::error::built from $was, main now has $now. The package would be"
              echo "::error::committed by a commit it is not a build of. Dispatch the"
              echo "::error::workflow again so the build sees the current tree."
              exit 1
            fi
          done
          echo "src/ and scripts/ unchanged since the build started"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: widget-${{ needs.build.outputs.version }}
          path: .build/out

      - name: Refuse to overwrite a released version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -d "production/$VERSION" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::error::production/$VERSION already exists. A rebuild of the same"
            echo "::error::version produces a different .wgt — fresh signature timestamps"
            echo "::error::at least — while <ver> stays put, so displays never re-download"
            echo "::error::it and latest/ would advertise bytes the fleet does not have."
            echo "::error::Bump the version, or re-run with force if you know the old one"
            echo "::error::was never distributed."
            exit 1
          fi

      - name: Refuse to go backwards
        if: inputs.publish_latest
        env:
          SSSP_VER: ${{ needs.build.outputs.sssp_ver }}
        run: |
          set -euo pipefail
          # Across BOTH served directories, not just latest/: they are written
          # together and nothing enforces that they agree, so the number to
          # beat is the higher of the two.
          baseline="$(scripts/served-baseline.sh)"

          case "$baseline" in
            none)
              echo "nothing published yet — no version to compare against"
              exit 0 ;;
            legacy)
              # The served descriptors say <ver>1.0.7</ver>, the legacy format
              # this pipeline replaces. Nothing to compare and nothing to
              # protect: every <ver> this pipeline emits is at least 10000, an
              # increase whether a display reads that string as an integer (1)
              # or compares it as text ("10010" > "1.0.7"). Blocking here would
              # mean the first rollout needed the force flag, which also
              # unlocks overwriting a released version — an unrelated
              # protection that should stay on.
              echo "::warning::the served descriptors advertise the legacy <ver> format this"
              echo "::warning::pipeline replaces. <ver>$SSSP_VER is an increase over it under"
              echo "::warning::every reading of that value, so publishing proceeds — but the"
              echo "::warning::previous publish is worth a look."
              exit 0 ;;
          esac

          # The main gate in the build job stops the common case; this stays as
          # the one that cannot be argued with. Displays only re-download when
          # the number grows, so a lower <ver> freezes the whole fleet on the
          # build it already has, silently and permanently — and a revert or a
          # force-push on main can lower the baseline too.
          if [ "$SSSP_VER" -le "$baseline" ]; then
            echo "::error::the fleet is already served <ver>$baseline and this build is"
            echo "::error::<ver>$SSSP_VER. Publishing it would strand every display on"
            echo "::error::the version it already runs. Check which ref you dispatched."
            exit 1
          fi
          echo "<ver> $baseline -> $SSSP_VER"

      - name: Place the package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "production/$VERSION"
          cp .build/out/*.wgt .build/out/sssp_config.xml "production/$VERSION/"

          if [ "${{ inputs.publish_latest }}" != "true" ]; then
            echo "production/latest/ left alone; prove it on one panel through SSSP first"
            exit 0
          fi

          # TWO directories are served to displays, not one. production/latest/
          # and production/ each carry a descriptor and a .wgt, they hold the
          # same package byte for byte today, and a given screen's configured
          # URL may be either. Updating only latest/ leaves every screen pointed
          # at production/ on <ver>1.0.7 forever — which is how production/1.0.9
          # came to exist in this repository without a display ever fetching it.
          for dir in production/latest production; do
            mkdir -p "$dir"
            cp .build/out/*.wgt .build/out/sssp_config.xml "$dir/"
          done
          echo "::warning::production/ and production/latest/ updated — the fleet follows these"

          # staging/ is a third served directory, carries its own widget name
          # (DigmiMarketingStaging) and is not built here. Say so rather than
          # leaving it to be discovered on a screen.
          # `|| true` for the reason the sister step above spells out: head
          # closes the pipe and pipefail turns that into a failed step.
          staging_ver="$(sed -n 's|.*<ver>\(.*\)</ver>.*|\1|p' \
            staging/sssp_config.xml | head -1 || true)"
          echo "::notice::staging/ still advertises <ver>$staging_ver and is not maintained by this workflow"

      - name: Commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SSSP_VER: ${{ needs.build.outputs.sssp_ver }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production
          git diff --cached --quiet && { echo 'nothing changed'; exit 0; }
          git commit -m "build(widget): publish $VERSION (sssp ver $SSSP_VER)

          Built and signed by the Release widget workflow, run ${{ github.run_number }}.
          production/latest/ updated: ${{ inputs.publish_latest }}"
          git push

      - name: Assemble the site exactly as the branch would have served it
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          # git archive, not a copy of the working tree: only tracked files at
          # the commit just made, so .build/ and any untracked stray cannot ride
          # along into what the fleet fetches.
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          # Bench instruments. This site is world-readable; see deploy-site.yml.
          rm -rf _site/lab
          # b2b/ is hand-published: if it fails its gate it is dropped from
          # the site rather than failing the deploy, so production/ and its
          # rollback path never wait on it. See scripts/guard-b2b-site.sh.
          # Through bash, with a fallback: if the guard itself cannot run
          # (lost exec bit, a syntax error), b2b/ is withheld in full and the
          # deploy still goes on - the guard must never be what blocks a
          # production/ rollback.
          bash scripts/guard-b2b-site.sh _site || {
            echo "::error::guard-b2b-site.sh itself failed ($?) - withholding all of b2b/ and continuing"
            rm -rf _site/b2b
          }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Confirm the fleet is actually being served this build
        env:
          SSSP_VER: ${{ needs.build.outputs.sssp_ver }}
          VERSION: ${{ needs.build.outputs.version }}
          WIDGET: ${{ needs.build.outputs.widget_name }}
          BASE: ${{ steps.deploy.outputs.page_url }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          # production/<version>/ is checked even when latest/ is left alone,
          # because that is the directory a panel gets pointed at by hand to
          # prove a release before the fleet is allowed to follow it. Sending
          # someone to a shop to test a URL we never confirmed is served is the
          # one trip this check exists to prevent.
          dirs="production/$VERSION"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            dirs="$dirs production/latest production"
          fi

          # The built package, not the committed copy: this run is what put the
          # committed copy there, and comparing it against itself would prove
          # only that cp works.
          #
          # Counted rather than `head -1`: two .wgt files in the artifact means
          # the one that was published and the one being checked here may be
          # different files, and picking the first silently is how that becomes
          # invisible.
          count="$(find .build/out -maxdepth 1 -name '*.wgt' | wc -l | tr -d ' ')"
          if [ "$count" != 1 ]; then
            echo "::error::expected exactly one .wgt in the artifact, found $count"
            exit 1
          fi
          built="$(find .build/out -maxdepth 1 -name '*.wgt')"

          # $dirs unquoted on purpose: it is a word list of directories.
          scripts/check-served.sh "$BASE" "$SSSP_VER" "$WIDGET" "$built" $dirs
